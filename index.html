<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunniva's World 🌱</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #24536b;
      min-height: 100vh;

      background:
        radial-gradient(circle at 20% 20%, #ffffff 0 3px, transparent 4px),
        radial-gradient(circle at 80% 30%, #ffffff 0 4px, transparent 5px),
        linear-gradient(180deg, #aee8ff 0%, #d9f7ff 45%, #c9f5d1 100%);

      background-size: 180px 180px, 240px 240px, 100% 100%;
    }

    /* Little floating clouds */
    body::before,
    body::after {
      content: "☁️";
      position: fixed;
      font-size: 70px;
      opacity: 0.75;
      z-index: -1;
      animation: float 8s ease-in-out infinite;
    }

    body::before {
      top: 80px;
      left: 4%;
    }

    body::after {
      right: 5%;
      top: 250px;
      font-size: 55px;
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    /* Main container */
    .page {
      width: min(900px, 94%);
      margin: 25px auto;
    }

    /* Header */
    header {
      background: rgba(255, 255, 255, 0.72);
      border: 3px solid white;
      border-radius: 25px;
      padding: 18px 25px;
      box-shadow:
        0 8px 0 rgba(71, 166, 196, 0.25),
        inset 0 2px 8px white;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: bold;
      color: #2087b0;
      text-shadow: 1px 2px white;
    }

    nav a {
      color: #287b99;
      text-decoration: none;
      font-weight: bold;
      margin-left: 15px;
      padding: 7px 12px;
      border-radius: 15px;
      transition: 0.2s;
    }

    nav a:hover {
      background: #b9efff;
      color: #12617e;
      box-shadow: inset 0 -2px rgba(41, 130, 157, 0.2);
    }

    /* Hero */
    .hero {
      margin-top: 18px;
      text-align: center;
      padding: 45px 20px 40px;

      background: linear-gradient(
        145deg,
        rgba(255,255,255,.9),
        rgba(222,250,255,.78)
      );

      border: 3px solid white;
      border-radius: 30px;

      box-shadow:
        0 10px 0 rgba(71, 166, 196, 0.22),
        inset 0 3px 12px white;
    }

    .bubble {
      display: inline-block;
      background: #ffb9dc;
      color: white;
      border: 3px solid white;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
      transform: rotate(-2deg);
      box-shadow: 0 3px 0 #d88eb6;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 7vw, 4rem);
      color: #1685ad;
      text-shadow:
        2px 2px white,
        4px 4px rgba(71, 166, 196, .18);
    }

    .hero h1 em {
      color: #ff83ba;
      font-style: normal;
    }

    .hero p {
      max-width: 570px;
      margin: 12px auto 22px;
      font-size: 1rem;
    }

    .button {
      display: inline-block;
      text-decoration: none;
      color: white;

      background: linear-gradient(#7edfff, #36afd2);
      border: 3px solid white;
      border-radius: 20px;

      padding: 9px 20px;
      font-weight: bold;

      box-shadow:
        0 4px 0 #248eae,
        inset 0 2px 5px rgba(255,255,255,.8);

      transition: .15s;
    }

    .button:hover {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #248eae,
        inset 0 2px 5px rgba(255,255,255,.8);
    }

    /* Sections */
    section {
      margin-top: 18px;
      background: rgba(255,255,255,.76);
      border: 3px solid white;
      border-radius: 25px;
      padding: 25px;

      box-shadow:
        0 7px 0 rgba(71, 166, 196, .18),
        inset 0 2px 10px white;
    }

    h2 {
      color: #1885aa;
      font-size: 1.5rem;
      margin-bottom: 16px;
      text-shadow: 1px 1px white;
    }

    /* About */
    .about {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .avatar {
      min-width: 75px;
      height: 75px;

      display: grid;
      place-items: center;

      background: linear-gradient(145deg, #fff, #bceeff);
      border: 3px solid white;
      border-radius: 50%;

      font-size: 2.3rem;

      box-shadow:
        0 4px 0 #80c9df,
        inset 0 3px 7px white;
    }

    /* Projects */
    .projects {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .project {
      background: #f8fdff;
      border: 3px solid white;
      border-radius: 20px;
      padding: 18px;

      box-shadow:
        0 4px 0 #b2dce9,
        inset 0 2px 7px white;

      transition: .2s;
    }

    .project:hover {
      transform: translateY(-4px) rotate(-1deg);
    }

    .project:nth-child(2) {
      background: #fff3fa;
      box-shadow:
        0 4px 0 #e6b5d1,
        inset 0 2px 7px white;
    }

    .project:nth-child(3) {
      background: #f2fff3;
      box-shadow:
        0 4px 0 #abd8b3,
        inset 0 2px 7px white;
    }

    .project h3 {
      color: #2585a3;
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .project p {
      font-size: .88rem;
      margin-bottom: 12px;
    }

    .project a {
      color: #ed70ac;
      font-weight: bold;
      text-decoration: none;
      font-size: .9rem;
    }

    .project a:hover {
      text-decoration: underline;
    }

    /* Contact */
    .contact {
      text-align: center;
      background: linear-gradient(135deg, #eaffff, #fdf0f8);
    }

    .email {
      display: inline-block;
      margin-top: 5px;
      color: #e56da6;
      font-weight: bold;
      text-decoration: none;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      font-size: .8rem;
      color: #477b8e;
    }

    .sparkles {
      color: #ff8fc2;
    }

    /* Mobile */
    @media (max-width: 650px) {
      header {
        flex-direction: column;
        padding: 15px;
      }

      nav a {
        margin: 0 4px;
        padding: 6px 7px;
        font
