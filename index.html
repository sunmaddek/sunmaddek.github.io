<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunniva | Portefølje</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f9ff;
      color: #172033;
      line-height: 1.6;
    }

    /* Navigasjon */
    nav {
      background: #0d6efd;
      padding: 18px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav .logo {
      font-size: 1.4rem;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: bold;
    }

    nav a:hover {
      opacity: 0.8;
    }

    /* Hero */
    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #0d6efd, #5aa9ff);
      color: white;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 7vw, 5rem);
      margin-bottom: 15px;
    }

    .hero em {
      color: #d9ecff;
      font-style: normal;
    }

    .hero p {
      font-size: 1.2rem;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: white;
      color: #0d6efd;
      padding: 12px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    /* Seksjoner */
    section {
      max-width: 1000px;
      margin: auto;
      padding: 80px 20px;
    }

    section h2 {
      text-align: center;
      color: #0d6efd;
      font-size: 2rem;
      margin-bottom: 40px;
    }

    /* Om meg */
    .about {
      text-align: center;
      max-width: 700px;
      margin: auto;
      font-size: 1.1rem;
    }

    /* Prosjekter */
    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .project {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(13, 110, 253, 0.08);
      border: 1px solid #e0edff;
      transition: 0.3s;
    }

    .project:hover {
      transform: translateY(-7px);
      box-shadow: 0 15px 35px rgba(13, 110, 253, 0.15);
    }

    .project h3 {
      color: #0d6efd;
      margin-bottom: 10px;
    }

    .project a {
      color: #0d6efd;
      font-weight: bold;
      text-decoration: none;
    }

    .project a:hover {
      text-decoration: underline;
    }

      background: #e8
